services:
  api:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/storage:/app/storage

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_INTERNAL_BASE=http://api:8000
    depends_on:
      - api
